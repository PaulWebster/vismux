name: Continuous Integration Build Test

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Cross-Compile, Verify and Optionally Release
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code and Local Toolchain
      uses: actions/checkout@v4

    - name: Install Multi-Architecture Cross-Compilers and POSIX Libraries
      run: |
        # Enable the 32-bit x86 (i386) architecture pool
        sudo dpkg --add-architecture i386
        sudo apt-get update
        # exclude gcc-multilib - usually required for x86-32 (-m32) compiles but causes dependency conflict
        # gcc-arm-linux-gnueabihf targets armhf and armv6 cross-compilation
        # gcc-aarch64-linux-gnu targets arm64 cross-compilation
        sudo apt-get install -y \
          build-essential \
          libc6-dev \
          gcc-i686-linux-gnu \
          gcc-arm-linux-gnueabihf \
          gcc-aarch64-linux-gnu \
          gcc-multilib- \
          libc6-dev-i386 \
          gcc-13-multilib-
          
        # Create explicit symlinks to guarantee 32-bit x86 compilation path works without gcc-multilib
        sudo ln -sf /usr/include/x86_64-linux-gnu/asm /usr/include/asm
        
        # For cross-compile to armv6 (Raspberry Pi B and Raspberry Pi Zero in particular)
        # outside of GitHub Actions because it is blocked ... wget https://musl.cc/armv6-linux-musleabihf-cross.tgz -o tools/musl.cc/armv6-linux-musleabihf-cross.tgz
        tar -xzf tools/armv6-linux-musleabihf-cross.tgz -C tools/
        echo "$GITHUB_WORKSPACE/tools/armv6-linux-musleabihf-cross/bin" >> $GITHUB_PATH

    - name: Verify Native Architecture Binary Compilation
      run: |
        make native

    - name: Verify Explicit Intel/AMD 64-bit Binary Compilation
      run: |
        make x86_64

    - name: Verify Explicit Intel x86 32-bit Binary Compilation
      run: |
        make x86-32

    - name: Verify Cross-Compiled ARM 64-bit (AArch64) Binary Compilation
      run: |
        make aarch64

    - name: Verify Cross-Compiled ARMhf (v7) 32-bit Binary Compilation
      run: |
        make armhf

    - name: Verify Cross-Compiled ARMv6 (Pi Zero/1) 32-bit Binary Compilation
      run: |
        make armv6

    - name: Verify Binary Headers using Kernel File Inspector
      run: |
        # Logs binary header properties to confirm layout separation
        file vismux
        file vismux-x86_64
        file vismux-x86-32
        file vismux-aarch64
        file vismux-armhf
        file vismux-armv6

    - name: Verify Executable Execution Bounds (Intel Platforms Only)
      run: |
        # Validates that native x86-compatible targets boot cleanly in this runner
        ./vismux --version
        ./vismux-x86_64 --version
        ./vismux-x86-32 --version

    # =========================================================================
    # PACKAGING PHASE (Runs every time so you can download and test archives)
    # =========================================================================
    - name: Package release assets
      run: |
        mkdir -p release
        for target in native x86_64 x86-32 aarch64 armhf armv6; do
          case "$target" in
            native) binary="vismux" ;;
            *) binary="vismux-$target" ;;
          esac
          archive="vismux-${GITHUB_REF_NAME}-${target}.tar.gz"
          tar -czf "release/$archive" "$binary" README.md systemd
        done
        sha256sum release/* > release/SHA256SUMS

    - name: Upload Testing Artifacts to Web UI
      uses: actions/upload-artifact@v4
      with:
        name: vismux-packaged-archives
        path: release/
        retention-days: 5

    # =========================================================================
    # RELEASE PHASE (Only executes when pushing a tag like v1.0.0)
    # =========================================================================
    - name: Create GitHub Release and Upload Assets
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        generate_release_notes: true
        files: release/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
