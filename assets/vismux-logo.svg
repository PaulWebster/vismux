<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" aria-labelledby="vismuxTitle vismuxDesc" role="img">
  <title id="vismuxTitle">vismux Icon</title>
  <desc id="vismuxDesc">An icon representing vismux, showing stereo VU audio meters receiving visualizer data from networked speakers.</desc>
  
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e24"/>
      <stop offset="100%" stop-color="#0a0a0c"/>
    </linearGradient>

    <!-- Strong Glow Filter for Small Scale Legibility -->
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Canvas Frame -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="496" height="496" x="8" y="8" rx="104" fill="none" stroke="#2a2a35" stroke-width="6"/>

  <!-- Network Pipelines (Updated to the accurate Lyrion Sage Green brand tone: rgb(218, 241, 199)) -->
  <g opacity="0.45">
    <path d="M 90 150 L 236 370" fill="none" stroke="rgb(218, 241, 199)" stroke-width="5" stroke-dasharray="8,8"/>
    <path d="M 210 110 L 246 365" fill="none" stroke="rgb(218, 241, 199)" stroke-width="5" stroke-dasharray="8,8"/>
    <path d="M 302 110 L 266 365" fill="none" stroke="rgb(218, 241, 199)" stroke-width="5" stroke-dasharray="8,8"/>
    <path d="M 422 150 L 276 370" fill="none" stroke="rgb(218, 241, 199)" stroke-width="5" stroke-dasharray="8,8"/>
  </g>

  <!-- LEFT VU METER (Channel L) -->
  <g>
    <!-- Dark baseline track backdrop underneath -->
    <path d="M 60 320 A 90 90 0 0 1 240 320" fill="none" stroke="#16161a" stroke-width="20" stroke-linecap="round"/>
    
    <!-- Flat-ended inner arcs splitting perfectly on a clean radial vector from (150, 330) -->
    <!-- Green Section: Arcs from left baseline to the 80% radial slice point (222.81, 267.10) -->
    <path d="M 60 320 A 90 90 0 0 1 222.81 267.10" fill="none" stroke="#00ff66" stroke-width="20" stroke-linecap="butt" opacity="0.9"/>
    <!-- Red Section: Arcs from the 80% mark to the right baseline -->
    <path d="M 222.81 267.10 A 90 90 0 0 1 240 320" fill="none" stroke="#ff2a4b" stroke-width="20" stroke-linecap="butt" opacity="0.9"/>
    
    <!-- Round caps only at the outer extremities -->
    <circle cx="60" cy="320" r="10" fill="#00ff66" opacity="0.9"/>
    <circle cx="240" cy="320" r="10" fill="#ff2a4b" opacity="0.9"/>

    <!-- Left Needle: Placed independently near the color transition -->
    <g filter="url(#glow)">
      <line x1="150" y1="330" x2="198" y2="242" stroke="#ffffff" stroke-width="9" stroke-linecap="round"/>
      <circle cx="150" cy="330" r="26" fill="#ffffff"/>
      <circle cx="150" cy="330" r="10" fill="#101014"/>
    </g>
  </g>

  <!-- RIGHT VU METER (Channel R) -->
  <g>
    <!-- Dark baseline track backdrop underneath -->
    <path d="M 272 320 A 90 90 0 0 1 452 320" fill="none" stroke="#16161a" stroke-width="20" stroke-linecap="round"/>
    
    <!-- Flat-ended inner arcs splitting perfectly on a clean radial vector from (362, 330) -->
    <!-- Green Section: Arcs from left baseline to the 80% radial slice point (434.81, 267.10) -->
    <path d="M 272 320 A 90 90 0 0 1 434.81 267.10" fill="none" stroke="#00ff66" stroke-width="20" stroke-linecap="butt" opacity="0.9"/>
    <!-- Red Section: Arcs from the 80% mark to the right baseline -->
    <path d="M 434.81 267.10 A 90 90 0 0 1 452 320" fill="none" stroke="#ff2a4b" stroke-width="20" stroke-linecap="butt" opacity="0.9"/>
    
    <!-- Round caps only at the outer extremities -->
    <circle cx="272" cy="320" r="10" fill="#00ff66" opacity="0.9"/>
    <circle cx="452" cy="320" r="10" fill="#ff2a4b" opacity="0.9"/>

    <!-- Right Needle: Placed independently just inside the red zone -->
    <g filter="url(#glow)">
      <line x1="362" y1="330" x2="428" y2="262" stroke="#ffffff" stroke-width="9" stroke-linecap="round"/>
      <circle cx="362" cy="330" r="26" fill="#ffffff"/>
      <circle cx="362" cy="330" r="10" fill="#101014"/>
    </g>
  </g>

  <!-- Network Destination Nodes: Loudspeaker Icons updated to accurate Lyrion green -->
  <!-- Far Left Speaker -->
  <g transform="translate(90, 150)" filter="url(#glow)">
    <circle cx="0" cy="0" r="28" fill="#1e1e24" stroke="rgb(218, 241, 199)" stroke-width="5"/>
    <path d="M -12,-7 L -7,-7 L -1,-13 L -1,13 L -7,7 L -12,7 Z" fill="rgb(218, 241, 199)"/>
    <path d="M 4,-7 A 9,9 0 0 1 4,7 M 9,-12 A 15,15 0 0 1 9,12" fill="none" stroke="rgb(218, 241, 199)" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Mid Left Speaker -->
  <g transform="translate(210, 110)" filter="url(#glow)">
    <circle cx="0" cy="0" r="28" fill="#1e1e24" stroke="rgb(218, 241, 199)" stroke-width="5"/>
    <path d="M -12,-7 L -7,-7 L -1,-13 L -1,13 L -7,7 L -12,7 Z" fill="rgb(218, 241, 199)"/>
    <path d="M 4,-7 A 9,9 0 0 1 4,7 M 9,-12 A 15,15 0 0 1 9,12" fill="none" stroke="rgb(218, 241, 199)" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Mid Right Speaker -->
  <g transform="translate(302, 110)" filter="url(#glow)">
    <circle cx="0" cy="0" r="28" fill="#1e1e24" stroke="rgb(218, 241, 199)" stroke-width="5"/>
    <path d="M -12,-7 L -7,-7 L -1,-13 L -1,13 L -7,7 L -12,7 Z" fill="rgb(218, 241, 199)"/>
    <path d="M 4,-7 A 9,9 0 0 1 4,7 M 9,-12 A 15,15 0 0 1 9,12" fill="none" stroke="rgb(218, 241, 199)" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Far Right Speaker -->
  <g transform="translate(422, 150)" filter="url(#glow)">
    <circle cx="0" cy="0" r="28" fill="#1e1e24" stroke="rgb(218, 241, 199)" stroke-width="5"/>
    <path d="M -12,-7 L -7,-7 L -1,-13 L -1,13 L -7,7 L -12,7 Z" fill="rgb(218, 241, 199)"/>
    <path d="M 4,-7 A 9,9 0 0 1 4,7 M 9,-12 A 15,15 0 0 1 9,12" fill="none" stroke="rgb(218, 241, 199)" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Branding Text -->
  <text x="256" y="448" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="56" font-weight="900" fill="#ffffff" letter-spacing="4" text-anchor="middle" filter="url(#glow)">vismux</text>
</svg>
